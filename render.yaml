services:
  - type: web
    name: unitask
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set this in Render dashboard → Environment
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard → Environment
